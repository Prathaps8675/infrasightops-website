<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="crimsonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="25%" stop-color="#F43F5E" />
      <stop offset="65%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="borderShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Glowing Crimson Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#crimsonBg)" filter="url(#brandGlow)" />
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="url(#borderShine)" stroke-width="1.5" />

  <!-- Crisp White Health Pulse / Heartbeat Line (1st Pic Style) -->
  <polyline points="18,52 31,52 39,32 50,70 58,40 64,54 70,52 82,52"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round" />
</svg>
